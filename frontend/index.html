<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>QR Code Generator</h1>
            <p>Generate QR codes for different purposes</p>
        </header>

        <main>
            <!-- QR Type Selection -->
            <section class="qr-type-selection">
                <h2>Select QR Code Type</h2>
                <div class="type-buttons">
                    <button class="type-btn active" data-type="basic">
                        <span class="icon">🔗</span>
                        <span class="label">Basic URL</span>
                    </button>
                    <button class="type-btn" data-type="pdf">
                        <span class="icon">📄</span>
                        <span class="label">PDF Link</span>
                    </button>
                    <button class="type-btn" data-type="api">
                        <span class="icon">🔌</span>
                        <span class="label">API Endpoint</span>
                    </button>
                    <button class="type-btn" data-type="secure">
                        <span class="icon">🔒</span>
                        <span class="label">Secure URL</span>
                    </button>
                </div>
            </section>

            <!-- Input Form -->
            <section class="input-section">
                <form id="qrForm">
                    <!-- Basic URL -->
                    <div class="form-group" id="basic-form">
                        <label for="basic-data">Enter URL or Text</label>
                        <input 
                            type="text" 
                            id="basic-data" 
                            placeholder="https://example.com"
                            required
                        >
                    </div>

                    <!-- PDF URL or Upload -->
                    <div class="form-group hidden" id="pdf-form">
                        <label>Choose Method</label>
                        <div class="method-tabs">
                            <button type="button" class="method-tab active" data-method="url">
                                🌐 Enter URL
                            </button>
                            <button type="button" class="method-tab" data-method="upload">
                                📤 Upload File
                            </button>
                        </div>
                        
                        <div id="pdf-url-input" class="method-content">
                            <label for="pdf-url">Document URL</label>
                            <input 
                                type="url" 
                                id="pdf-url" 
                                placeholder="https://example.com/document.pdf"
                            >
                        </div>
                        
                        <div id="pdf-file-input" class="method-content hidden">
                            <label for="pdf-file">Upload Document</label>
                            <div class="file-upload-box">
                                <input 
                                    type="file" 
                                    id="pdf-file" 
                                    accept=".pdf,.doc,.docx"
                                    class="file-input-hidden"
                                >
                                <div class="file-upload-placeholder" id="file-placeholder">
                                    <div class="upload-icon">📁</div>
                                    <div class="upload-text">
                                        <strong>Click to upload</strong> or drag and drop
                                    </div>
                                    <div class="upload-hint">PDF, DOC, DOCX (Max 10MB)</div>
                                </div>
                                <div class="file-selected-info hidden" id="file-info">
                                    <div class="file-icon-large">📄</div>
                                    <div class="file-details">
                                        <div class="file-name-display" id="file-name-display"></div>
                                        <div class="file-size-display" id="file-size-display"></div>
                                    </div>
                                    <button type="button" class="file-remove-btn" id="file-remove-btn">
                                        ✕ Remove
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- API Endpoint -->
                    <div class="form-group hidden" id="api-form">
                        <label for="api-endpoint">Enter API Endpoint</label>
                        <input 
                            type="url" 
                            id="api-endpoint" 
                            placeholder="https://api.example.com/data"
                        >
                    </div>

                    <!-- Secure URL -->
                    <div class="form-group hidden" id="secure-form">
                        <label for="secure-url">Enter URL to Hide</label>
                        <input 
                            type="url" 
                            id="secure-url" 
                            placeholder="https://example.com/sensitive"
                        >
                        <small class="help-text">This URL will be hidden behind a short link</small>
                    </div>

                    <!-- Description (Optional for all) -->
                    <div class="form-group">
                        <label for="description">Description (Optional)</label>
                        <input 
                            type="text" 
                            id="description" 
                            placeholder="Add a description for this QR code"
                        >
                    </div>

                    <button type="submit" class="generate-btn">
                        <span class="btn-text">Generate QR Code</span>
                        <span class="loader hidden"></span>
                    </button>
                </form>
            </section>

            <!-- Output Section -->
            <section class="output-section hidden" id="output">
                <h2>Your QR Code</h2>
                <div class="qr-result">
                    <div class="qr-image-container">
                        <img id="qr-image" src="" alt="Generated QR Code">
                    </div>
                    <div class="qr-info">
                        <div class="info-item">
                            <span class="info-label">Type:</span>
                            <span class="info-value" id="result-type"></span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Data:</span>
                            <span class="info-value" id="result-data"></span>
                        </div>
                        <div class="info-item hidden" id="short-url-info">
                            <span class="info-label">Short URL:</span>
                            <span class="info-value" id="result-short-url"></span>
                        </div>
                        <div class="info-item hidden" id="description-info">
                            <span class="info-label">Description:</span>
                            <span class="info-value" id="result-description"></span>
                        </div>
                    </div>
                    <div class="action-buttons">
                        <button class="download-btn" id="download-btn">Download QR Code</button>
                        <button class="reset-btn" id="reset-btn">Generate Another</button>
                    </div>
                </div>
            </section>

            <!-- Error Message -->
            <div class="error-message hidden" id="error-message">
                <span class="error-icon">⚠️</span>
                <span class="error-text" id="error-text"></span>
            </div>
        </main>

        <footer>
            <p>QR Code Generator - Secure & Simple</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
